# Railway deployment config using Nixpacks
# Docs: https://docs.railway.app/config/build-and-start-commands

# ---- Build phase: install Python + cadquery + Node deps + build Next.js ----
[build]
builder = "NIXPACKS"
nixpacksConfigVersion = 1

# Install Python + cadquery + Node deps in one cached layer
installCmd = """
  apt-get update && \
  apt-get install -y python3 python3-pip python3-venv libgl1 libglib2.0-0 libxrender1 libxext6 libsm6 && \
  python3 -m venv /opt/venv && \
  /opt/venv/bin/pip install --no-cache-dir cadquery && \
  bun install --frozen-lockfile || bun install || npm install
"""

# Build the Next.js standalone bundle
buildCmd = "bun run build || npm run build"

# ---- Start phase: MUST use node (not bun) for Next.js standalone -----------
[start]
# Next.js standalone is designed for Node, not bun. Using bun causes
# "Application failed to respond" because the HTTP server doesn't bind correctly.
startCommand = "node .next/standalone/server.js"

# ---- Runtime config -------------------------------------------------------
[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
